services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-irrigation-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    volumes:
      - ./models:/app/models
      - ./data/live:/app/data/live
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
